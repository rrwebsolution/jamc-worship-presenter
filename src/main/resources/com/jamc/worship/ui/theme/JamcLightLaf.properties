# JAMC Worship Presenter - light theme (extends FlatLightLaf)

@accentColor = #1677FF
@selectionBackground = #1677FF
@selectionForeground = #FFFFFF
@selectionInactiveBackground = #D6E6FF

Jamc.windowBackground = #E2E8F0
Jamc.panelBackground = #FFFFFF
Jamc.secondaryBackground = #F1F5F9
Jamc.hoverBackground = #E8EEF6
Jamc.border = #D5DCE6
Jamc.accent = #1677FF
Jamc.live = #16A34A
Jamc.danger = #DC2626
Jamc.warning = #D97706
Jamc.text = #0F172A
Jamc.secondaryText = #475569
Jamc.mutedText = #94A3B8
Jamc.monitorBackground = #000000
Jamc.monitorText = #FFFFFF

Component.arc = 8
Button.arc = 8
TextComponent.arc = 8
Component.focusWidth = 1
Component.innerFocusWidth = 0
Button.default.background = #1677FF
Button.default.foreground = #FFFFFF
Button.toolbar.selectedBackground = #D6E6FF

List.selectionArc = 8
List.selectionInsets = 1,6,1,6
List.cellNoFocusBorder = 0,0,0,0
List.focusCellHighlightBorder = 0,0,0,0

ScrollBar.thumbArc = 999
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.width = 10
ScrollBar.showButtons = false

SplitPane.dividerSize = 6
SplitPaneDivider.style = plain
SplitPane.background = #E2E8F0
SplitPaneDivider.gripColor = #E2E8F0

TabbedPane.underlineColor = #1677FF
TabbedPane.tabHeight = 30
TabbedPane.showTabSeparators = false

TitlePane.background = #E2E8F0
TitlePane.inactiveBackground = #E2E8F0
MenuBar.background = #E2E8F0
Panel.background = #FFFFFF
