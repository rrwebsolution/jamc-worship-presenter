# LiveCat Multimedia - dark broadcast theme (extends FlatDarkLaf)

@background = #111827
@foreground = #F8FAFC
@disabledForeground = #64748B
@accentColor = #1677FF
@selectionBackground = #1677FF
@selectionForeground = #FFFFFF
@selectionInactiveBackground = #1E3A66
@componentBackground = #172033
@buttonBackground = #1C2740

# --- Application palette (read through com.jamc.worship.ui.theme.Palette) ---
Jamc.windowBackground = #0B1220
Jamc.panelBackground = #111827
Jamc.secondaryBackground = #172033
Jamc.hoverBackground = #1C2740
Jamc.border = #223047
Jamc.accent = #1677FF
Jamc.live = #16A34A
Jamc.danger = #EF4444
Jamc.warning = #F59E0B
Jamc.text = #F8FAFC
Jamc.secondaryText = #B3C0D4
Jamc.mutedText = #8291A8
Jamc.monitorBackground = #000000
Jamc.monitorText = #FFFFFF

# --- Shape ---
Component.arc = 8
Button.arc = 8
TextComponent.arc = 8
CheckBox.arc = 4
Component.focusWidth = 1
Component.innerFocusWidth = 0
Component.borderColor = #2A3954
Component.focusedBorderColor = #1677FF
Component.focusColor = #1677FF66

Button.background = #1C2740
Button.hoverBackground = #24324F
Button.pressedBackground = #2B3B5C
Button.borderColor = #2A3954
Button.default.background = #1677FF
Button.default.foreground = #FFFFFF
Button.default.hoverBackground = #2B86FF
Button.default.pressedBackground = #0F66E0
Button.default.borderColor = #1677FF
Button.toolbar.hoverBackground = #1C2740
Button.toolbar.pressedBackground = #24324F
Button.toolbar.selectedBackground = #1E3A66

TextField.background = #172033
FormattedTextField.background = #172033
PasswordField.background = #172033
TextArea.background = #0F1729
TextPane.background = #0F1729
EditorPane.background = #0F1729
Spinner.background = #172033
ComboBox.background = #172033
ComboBox.buttonBackground = #172033
ComboBox.popupBackground = #172033

List.background = #111827
List.selectionArc = 8
List.selectionInsets = 1,6,1,6
List.cellNoFocusBorder = 0,0,0,0
List.focusCellHighlightBorder = 0,0,0,0
Tree.background = #111827
Table.background = #111827

ScrollPane.background = #111827
ScrollBar.track = #111827
ScrollBar.thumb = #2A3954
ScrollBar.hoverThumbColor = #344766
ScrollBar.thumbArc = 999
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.width = 10
ScrollBar.showButtons = false

SplitPane.background = #0B1220
SplitPaneDivider.draggingColor = #1677FF
SplitPane.dividerSize = 6
SplitPaneDivider.style = plain
SplitPaneDivider.gripColor = #0B1220

TabbedPane.background = #111827
TabbedPane.underlineColor = #1677FF
TabbedPane.selectedBackground = #111827
TabbedPane.hoverColor = #1C2740
TabbedPane.tabHeight = 30
TabbedPane.showTabSeparators = false

MenuBar.background = #0B1220
MenuBar.borderColor = #0B1220
PopupMenu.background = #172033
PopupMenu.borderColor = #2A3954
Menu.background = #0B1220
MenuItem.background = #172033
MenuItem.selectionBackground = #1E3A66
