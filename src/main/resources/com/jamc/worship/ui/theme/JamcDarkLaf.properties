TitlePane.background = #0B1220
TitlePane.inactiveBackground = #0B1220
TitlePane.unifiedBackground = false
TitlePane.embeddedForeground = #94A3B8

ToolTip.background = #172033
ToolTip.foreground = #F8FAFC

OptionPane.background = #111827
Panel.background = #111827
Separator.foreground = #223047
