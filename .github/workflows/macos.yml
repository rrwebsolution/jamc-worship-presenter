# Builds a macOS preview (LiveCat-Multimedia-<version>-mac.dmg) on GitHub's Mac computers, for testing on a
# borrowed Mac. It runs by itself after every successful Windows release (or by hand: Actions -> "macOS preview" ->
# Run workflow). The .dmg is added to the release of
# the newest version (vX.Y.Z on the Releases page) and is also a download of the run (Artifacts). The website finds it
# there and shows "Download for macOS (Preview)". The Windows "Update available" only ever takes the .exe.
name: macOS preview

on:
  workflow_dispatch:
  # by itself after every Windows release, so each version also gets its .dmg
  workflow_run:
    workflows: ["Windows installer"]
    types: [completed]

permissions:
  contents: write

jobs:
  dmg:
    # Apple Silicon (M1 and newer). Intel Macs are not built yet.
    runs-on: macos-latest
    # after a Windows release: only when it worked (its version tag then exists)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version tags
          # the same code the Windows installer was built from
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Version
        id: v
        run: |
          git fetch --tags --force --quiet
          v=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          v=${v:-0.1.0}
          IFS=. read -r major minor patch <<< "$v"
          # macOS wants the first number above zero: 0.1.50 becomes 1.1.50 inside the app bundle
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "bundle=$((major + 1)).$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "Building macOS preview of $v"

      - name: Build the app
        # the tests run on the Windows build; some of them need Windows
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp versions:set -DnewVersion=${{ steps.v.outputs.version }} -DgenerateBackupPoms=false
          ./mvnw -B -ntp package -DskipTests

      # FFmpeg goes inside the app: cameras, recording and livestream work without Homebrew or the Terminal.
      # ffmpeg-static downloads a ready-made FFmpeg for this Mac (Apple Silicon).
      - name: Bundled FFmpeg
        run: |
          mkdir -p ff staging
          (cd ff && npm init -y >/dev/null && npm install --no-save --no-audit --no-fund ffmpeg-static@5.2.0)
          bin=ff/node_modules/ffmpeg-static/ffmpeg
          test -x "$bin" || { echo "::error::ffmpeg-static gave no FFmpeg"; exit 1; }
          file "$bin"
          "$bin" -hide_banner -version > ff/version.txt
          sed -n 1p ff/version.txt
          # what LiveCat needs on a Mac, checked here so a .dmg without it is never made
          "$bin" -hide_banner -devices > ff/devices.txt 2>&1 || true
          "$bin" -hide_banner -encoders > ff/encoders.txt 2>&1 || true
          grep -q avfoundation ff/devices.txt || { echo "::error::FFmpeg has no AVFoundation (cameras, microphones)"; exit 1; }
          grep -q " libx264 " ff/encoders.txt || { echo "::error::FFmpeg has no libx264 (recording)"; exit 1; }
          grep -q " aac " ff/encoders.txt || { echo "::error::FFmpeg has no AAC (sound)"; exit 1; }
          if grep -q h264_videotoolbox ff/encoders.txt; then echo "Mac hardware encoder: yes"; else echo "Mac hardware encoder: no"; fi
          cp "$bin" staging/ffmpeg
          chmod +x staging/ffmpeg
          codesign --force --sign - staging/ffmpeg

      # LiveCat's own sound (videos, music, YouTube) in recordings and the livestream: the Mac twin of the Windows
      # loopback helper, using ScreenCaptureKit (macOS 13+). Next to the jar, where LiveCat looks for it.
      - name: App sound helper
        run: |
          mkdir -p staging
          swiftc -O -target arm64-apple-macos13.0 -o staging/livecat-audio packaging/mac/livecat-audio.swift
          chmod +x staging/livecat-audio
          codesign --force --sign - staging/livecat-audio
          # a quick start check: without arguments it must answer with its usage line, not crash
          if staging/livecat-audio 2> ff-usage.txt; then echo "::error::livecat-audio ran without arguments"; exit 1; fi
          grep -q "^ERROR usage" ff-usage.txt || { echo "::error::livecat-audio did not start"; cat ff-usage.txt; exit 1; }

      - name: App icon
        run: |
          mkdir -p icon.iconset
          src=src/main/resources/branding/livecat-icon.png
          for s in 16 32 128 256 512; do
            sips -z $s $s "$src" --out icon.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s * 2))
            sips -z $d $d "$src" --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o app.icns

      - name: Make the .dmg
        run: |
          v=${{ steps.v.outputs.version }}
          mkdir -p staging dist
          cp "target/jamc-worship-presenter-$v-all.jar" staging/
          test -x staging/ffmpeg # from "Bundled FFmpeg": next to the jar, where LiveCat looks first
          test -x staging/livecat-audio # from "App sound helper"
          jlink --add-modules ALL-MODULE-PATH --module-path "$JAVA_HOME/jmods" --strip-debug --no-header-files --no-man-pages --output runtime
          jpackage --type app-image --dest appimage \
            --name "LiveCat Multimedia" --app-version ${{ steps.v.outputs.bundle }} --vendor "LiveCat" \
            --description "Present. Produce. Go Live." \
            --input staging --main-jar "jamc-worship-presenter-$v-all.jar" --main-class com.jamc.worship.app.Main \
            --runtime-image runtime --icon app.icns \
            --mac-package-identifier com.livecat.multimedia --mac-package-name "LiveCat" \
            --java-options "--enable-native-access=ALL-UNNAMED" --java-options "-Dfile.encoding=UTF-8" \
            --java-options "-XX:MaxRAMPercentage=50"
          app="appimage/LiveCat Multimedia.app"
          # macOS asks before a camera or microphone is used, and only when the app says why
          plist="$app/Contents/Info.plist"
          # jpackage may already have put a key in: change it then, add it otherwise
          setkey() {
            /usr/libexec/PlistBuddy -c "Set :$1 '$2'" "$plist" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :$1 string '$2'" "$plist"
          }
          setkey NSCameraUsageDescription "LiveCat shows your cameras in scenes, recordings and the livestream."
          setkey NSMicrophoneUsageDescription "LiveCat records and streams your microphones."
          chmod +x "$app/Contents/app/ffmpeg" "$app/Contents/app/livecat-audio"
          # changing Info.plist breaks jpackage's signature: sign again (ad hoc, no Apple Developer account)
          codesign --force --sign - "$app/Contents/app/ffmpeg"
          codesign --force --sign - "$app/Contents/app/livecat-audio"
          codesign --force --deep --sign - "$app"
          jpackage --type dmg --dest dist --app-image "$app" \
            --name "LiveCat Multimedia" --app-version ${{ steps.v.outputs.bundle }} --vendor "LiveCat"
          mv dist/*.dmg "dist/LiveCat-Multimedia-$v-mac.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: LiveCat-Multimedia-${{ steps.v.outputs.version }}-mac
          path: dist/*.dmg

      # next to the Windows installer of the same version; the release text and the .exe stay as they are
      - name: Add to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ steps.v.outputs.version }}" dist/*.dmg --clobber
