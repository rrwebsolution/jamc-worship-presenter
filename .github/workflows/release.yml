# Builds the Windows installer (LiveCat-Multimedia-<version>.exe) and publishes it on the
# GitHub Releases page, where installed copies find it ("Update available").
#  - Every push to master: the next version (last v1.2.3 tag + 1, e.g. 0.1.3 -> 0.1.4).
#    Put [skip ci] in the commit message to push without making a new version.
#  - Actions tab -> Run workflow: a version you type (e.g. 0.2.0 for a bigger update).
name: Windows installer

on:
  push:
    branches: [master]
    paths-ignore: ["**.md", ".vscode/**", ".gitignore"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (numbers only, e.g. 0.2.0). Empty = next version."
        required: false
        default: ""

permissions:
  contents: write

# one release at a time, in push order, so two quick pushes get 0.1.4 and 0.1.5
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version tags

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Version
        id: v
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}".Trim()
          if (-not $v) {
            git fetch --tags --force --quiet
            $last = git tag --list "v*" | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
              ForEach-Object { [version]$_.TrimStart("v") } | Sort-Object | Select-Object -Last 1
            $v = if ($last) { "$($last.Major).$($last.Minor).$($last.Build + 1)" } else { "0.1.0" }
          }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Version must look like 1.2.3 (got '$v')" }
          if (git tag --list "v$v") { throw "Version $v already exists. Choose a higher one." }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $v"

      - name: Build the app (with tests)
        shell: pwsh
        run: ./mvnw.cmd -B -ntp versions:set "-DnewVersion=${{ steps.v.outputs.version }}" -DgenerateBackupPoms=false; ./mvnw.cmd -B -ntp package

      - name: Install WiX 3 (needed by jpackage for .exe)
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y
          $bin = (Get-ChildItem "${env:ProgramFiles(x86)}" -Filter "WiX Toolset*" -Directory | Select-Object -First 1).FullName + "\bin"
          $bin >> $env:GITHUB_PATH

      - name: Make the installer
        shell: pwsh
        run: |
          $v = "${{ steps.v.outputs.version }}"
          New-Item -ItemType Directory -Force staging, dist | Out-Null
          Copy-Item "target/jamc-worship-presenter-$v-all.jar" staging/
          # a full Java runtime goes inside the app: the laptop needs no Java installed
          jlink --add-modules ALL-MODULE-PATH --module-path "$env:JAVA_HOME/jmods" --strip-debug --no-header-files --no-man-pages --output runtime
          # the installer's last page gets "Launch LiveCat Multimedia" (ticked): this JDK's own main.wxs plus our fragment
          & "$env:JAVA_HOME/bin/jmod" extract --dir jpkg "$env:JAVA_HOME/jmods/jdk.jpackage.jmod"
          $main = Get-Content jpkg/classes/jdk/jpackage/internal/resources/main.wxs -Raw
          if (([regex]::Matches($main, '</Product>')).Count -ne 1) { throw "jpackage main.wxs changed: no single </Product>" }
          $main = $main.Replace('</Product>', (Get-Content packaging/launch-after-install.wxs-fragment -Raw) + "  </Product>")
          New-Item -ItemType Directory -Force jpres | Out-Null
          Set-Content jpres/main.wxs $main -Encoding utf8
          jpackage --type exe --dest dist --resource-dir jpres `
            --name "LiveCat Multimedia" --app-version $v --vendor "LiveCat" `
            --description "Present. Produce. Go Live." `
            --input staging --main-jar "jamc-worship-presenter-$v-all.jar" --main-class com.jamc.worship.app.Main `
            --runtime-image runtime --icon packaging/app.ico `
            --java-options "--enable-native-access=ALL-UNNAMED" --java-options "-Dfile.encoding=UTF-8" `
            --win-menu --win-menu-group "LiveCat" --win-shortcut --win-dir-chooser --win-per-user-install `
            --win-upgrade-uuid 2c7919e6-0df8-4da3-97ba-26bfd85c0057
          Get-ChildItem dist/*.exe | Rename-Item -NewName "LiveCat-Multimedia-$v.exe"
          # the operator manual goes on every release, next to the installer
          Copy-Item docs/User-Manual.html dist/LiveCat-Multimedia-User-Manual.html

      - uses: actions/upload-artifact@v4
        with:
          name: LiveCat-Multimedia-${{ steps.v.outputs.version }}
          path: dist/*.exe

      - name: Publish on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: LiveCat Multimedia ${{ steps.v.outputs.version }}
          files: |
            dist/*.exe
            dist/LiveCat-Multimedia-User-Manual.html
          body: |
            **Install:** download `LiveCat-Multimedia-${{ steps.v.outputs.version }}.exe` below and run it.
            Windows may show "Windows protected your PC": click **More info → Run anyway** (the installer is not code-signed).

            Also install on the laptop:
            - **VLC media player (64-bit)** from videolan.org: videos, music, cameras
            - **FFmpeg** for recording / livestream: open Command Prompt and run `winget install Gyan.FFmpeg`

            YouTube playback downloads its player engine (Chromium) once, on first use, so keep the internet on the first time.

            **User manual:** download `LiveCat-Multimedia-User-Manual.html` below and open it in Chrome or Edge.
